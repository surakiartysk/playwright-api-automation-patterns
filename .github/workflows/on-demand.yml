name: On-demand

# Run a chosen slice of the suite, without pushing anything.
#
# Two ways in:
#
# 1. `workflow_dispatch` — a human picks a style and a scope from the Actions
#    tab. What you reach for when triaging "is this service red, or is it just
#    that one spec?".
#
# 2. `repository_dispatch` — another system asks for a run. In a real setup
#    this is the deploy pipeline saying "SIT is up, verify it":
#
#      curl -X POST -H "Accept: application/vnd.github+json" \
#        -H "Authorization: Bearer $TOKEN" \
#        https://api.github.com/repos/<owner>/<repo>/dispatches \
#        -d '{"event_type":"run-tests","client_payload":{"scope":"all"}}'
#
#    Here it has nothing external to point at — the mock ships with the repo —
#    so it exists to show the wiring, and it is honest about that.
on:
  workflow_dispatch:
    inputs:
      style:
        description: 'Which package to run'
        required: true
        default: 'both'
        type: choice
        options: [both, functional-style, class-style]
      scope:
        description: 'Tag to filter by (without @) — a service is a tag too. "all" runs everything.'
        required: true
        default: 'smoke'
        type: choice
        # Every tag the specs use, and nothing else — `check:parity` holds it
        # there. A tag that is not offered here cannot be run on demand at all.
        options:
          [all, smoke, isolated, flow, items, reservations, maintenance-logs, core, cross-service]
      tag:
        description: 'Optional second tag: only tests carrying this one AND the scope. "all" adds no narrowing.'
        required: false
        default: 'all'
        type: choice
        # The tags that cut across services, not the services themselves —
        # `check:parity` holds this to the scope list above.
        options: [all, smoke, isolated, flow, cross-service]
      workers:
        description: 'Parallel workers — drop to 1 to investigate a suspected race'
        required: false
        default: '4'
        type: string
      run_id:
        description: 'Caller run id. Set by the dashboard; leave blank when running by hand.'
        required: false
        default: ''
        type: string

  repository_dispatch:
    types: [run-tests]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # an explicit request should not cancel another

permissions:
  contents: read

jobs:
  run:
    name: ${{ github.event.inputs.style || 'both' }} / @${{ github.event.inputs.scope || 'smoke' }}${{ (github.event.inputs.tag && github.event.inputs.tag != 'all') && format(' + @{0}', github.event.inputs.tag) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Inputs arrive from two shapes — a form, or a payload — so they are
      # normalised once here rather than in every step below.
      - name: Resolve inputs
        id: opts
        run: |
          STYLE="${{ github.event.inputs.style || github.event.client_payload.style || 'both' }}"
          SCOPE="${{ github.event.inputs.scope || github.event.client_payload.scope || 'smoke' }}"
          TAG="${{ github.event.inputs.tag || github.event.client_payload.tag || 'all' }}"
          WORKERS="${{ github.event.inputs.workers || github.event.client_payload.workers || '4' }}"
          RUN_ID="${{ github.event.inputs.run_id || github.event.client_payload.run_id || '' }}"

          # What to grep for, as a pattern rather than as flags: the pattern
          # for two tags contains parentheses, which the shell would read as
          # syntax if it were pasted into the command line unquoted. It travels
          # as data and is quoted where it is used.
          #
          # Both tags means a title carrying both. Playwright matches the
          # pattern as a regular expression against the whole title, and two
          # lookaheads at the start say "this and that, in either order" —
          # `--grep @a --grep @b` would say "this or that", which is the
          # opposite of narrowing. Naming the same tag twice is just that tag.
          if   [ "$SCOPE" = "all" ] && [ "$TAG" = "all" ]; then PATTERN=""
          elif [ "$TAG" = "all" ] || [ "$TAG" = "$SCOPE" ]; then PATTERN="@$SCOPE"
          elif [ "$SCOPE" = "all" ]; then PATTERN="@$TAG"
          else PATTERN="(?=.*@$SCOPE)(?=.*@$TAG)"
          fi

          # `both` names the two test packages rather than using `-r`.
          #
          # `-r` runs in EVERY workspace package, and `shared-contract` holds
          # the OpenAPI contract and the mock — it has no Playwright, so
          # `pnpm -r exec playwright` aborts the whole run with
          # "Command \"playwright\" not found" before a single test executes.
          # The dashboard then records a run with total: 0 and no report.
          #
          # Not hypothetical: this is what a real dispatch did once the
          # dashboard started sending `style: both`. ci.yml never hit it
          # because it targets the two packages by name.
          #
          # `--workspace-concurrency=1` for the same reason `pnpm test` uses
          # `--sequential`: both packages start their own mock on port 4010, so
          # running them at once fails the second with EADDRINUSE before any
          # test runs. (`exec` has no `--sequential`; this is its spelling.)
          case "$STYLE" in
            both) FILTER="--workspace-concurrency=1 --filter @gear-rental/functional-style --filter @gear-rental/class-style" ;;
            *)    FILTER="--filter @gear-rental/$STYLE" ;;
          esac

          echo "pattern=$PATTERN"  >> "$GITHUB_OUTPUT"
          echo "filter=$FILTER"   >> "$GITHUB_OUTPUT"
          echo "workers=$WORKERS" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID"   >> "$GITHUB_OUTPUT"
          echo "Running $STYLE with scope @$SCOPE, tag $TAG, on $WORKERS workers"

      - name: Run tests
        id: run
        # A red suite must still reach the callback below — a run that fails
        # without reporting leaves the caller's dashboard stuck on "running"
        # forever. The verdict is carried in an output and re-raised at the end.
        #
        # PLAYWRIGHT_JSON_OUTPUT_NAME makes the json reporter write to a file
        # instead of stdout, which is what the next step reads.
        #
        # `allure-playwright` is named explicitly rather than left to the
        # config. `--reporter` *replaces* the config's list rather than adding
        # to it, so the earlier `list,json` here silently switched off the
        # `html` and `allure-playwright` reporters playwright.config.ts
        # declares — the report this job claimed to upload was never generated.
        #
        # The pattern is passed as an environment variable and quoted where it
        # is used. Written into the command through `${{ }}` it would be pasted
        # into the shell's text, and a pattern with parentheses in it is a
        # syntax error there. `:+` leaves out the flag entirely when there is no
        # pattern, which is what running everything means.
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
          GREP_PATTERN: ${{ steps.opts.outputs.pattern }}
        run: |
          pnpm ${{ steps.opts.outputs.filter }} exec playwright test \
            ${GREP_PATTERN:+--grep "$GREP_PATTERN"} \
            --workers=${{ steps.opts.outputs.workers }} \
            --reporter=list,json,allure-playwright || echo "failed=true" >> "$GITHUB_OUTPUT"

      # Totals for the callback, read from Playwright's own JSON rather than
      # scraped from stdout.
      - name: Summarise
        if: always() && steps.opts.outputs.run_id != ''
        id: totals
        run: |
          node -e '
            const { readdirSync, existsSync, readFileSync } = require("fs")
            let total = 0, passed = 0, failed = 0, duration = 0
            for (const pkg of readdirSync("packages")) {
              const f = `packages/${pkg}/results.json`
              if (!existsSync(f)) continue
              const report = JSON.parse(readFileSync(f, "utf8"))
              // Summed, because the two packages run one after the other here
              // — they both bind port 4010 for their own mock, so the run is
              // sequential and the total really is the sum. The UI suite takes
              // the maximum instead, for exactly the opposite reason.
              duration += Math.round(report.stats?.duration ?? 0)
              const walk = (suites) => {
                for (const s of suites ?? []) {
                  for (const spec of s.specs ?? []) {
                    total += 1
                    if (spec.ok) passed += 1
                    else failed += 1
                  }
                  walk(s.suites)
                }
              }
              walk(JSON.parse(readFileSync(f, "utf8")).suites)
            }
            const out = require("fs").createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" })
            out.write(`total=${total}\npassed=${passed}\nfailed=${failed}\nduration=${duration}\n`)
          '

      # Which tests failed and why, for the dashboard's detail row.
      #
      # The callback below used to carry totals only, so a run the dashboard knew
      # had failed could not say which test without opening the whole report.
      # The summary is bounded (twenty failures, a line of message each) and
      # read from the same results.json as the totals above. Its own step so a
      # problem reading it cannot stop the totals from being sent: it is
      # `continue-on-error`, and the callback treats a missing file as no detail.
      - name: Collect the failures
        if: always() && steps.opts.outputs.run_id != ''
        continue-on-error: true
        run: node .github/scripts/failures.mjs

      # Build the report the dashboard will serve.
      #
      # Both packages' results merge into one report, because the question this
      # repo asks is how the two styles compare — see decision 11. Only built
      # when a caller is waiting for it; a hand-started run reads its results
      # from the Actions log.
      - name: Build the Allure report
        if: always() && steps.opts.outputs.run_id != '' && vars.DASHBOARD_WEBHOOK_URL != ''
        run: pnpm allure

      # Upload it straight into the dashboard's R2 bucket.
      #
      # Uploading directly rather than POSTing the bytes to the dashboard: an
      # endpoint accepting several megabytes is a body-size limit, a parser and
      # a signing scheme over something too big to buffer — all to reach a
      # bucket this job can already write to with a scoped token. The token is
      # scoped to this one bucket, so what leaks if it leaks is the ability to
      # write reports.
      #
      # One PUT, because the report is built with `--single-file`. The
      # multi-file form is ~450 objects: hundreds of round trips per run, and
      # hundreds of individually-authorised assets to serve afterwards.
      #
      # `continue-on-error`: a failed upload must not fail the run or skip the
      # callback below. A run whose numbers arrive without a report is worth
      # more than a run the dashboard never hears about at all.
      # The credentials are checked inside the script rather than in `if:` —
      # the `secrets` context is not available to a step-level condition.
      - name: Upload the report to the dashboard
        id: upload
        if: always() && steps.opts.outputs.run_id != '' && vars.DASHBOARD_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUN_ID: ${{ steps.opts.outputs.run_id }}
        run: node .github/scripts/upload-report.mjs allure-report/index.html "runs/$RUN_ID/index.html"

      # Report the result back to whoever asked for the run.
      #
      # Signed over `timestamp.body`, not the body alone: a captured callback
      # would otherwise be replayable forever. The receiving end enforces a
      # five-minute window — see the dashboard's routes/webhook.ts.
      #
      # Skipped entirely when nobody asked: a hand-started run has no caller to
      # report to, and posting to an unset URL would fail the job for no reason.
      #
      # Runs after the upload so `reportPath` is only claimed once the bytes
      # are actually there — the dashboard trusts this field, and a path
      # pointing at nothing is a report link that 404s.
      - name: Report the result
        if: always() && steps.opts.outputs.run_id != '' && vars.DASHBOARD_WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ vars.DASHBOARD_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DASHBOARD_WEBHOOK_SECRET }}
          RUN_ID: ${{ steps.opts.outputs.run_id }}
          STATUS: ${{ steps.run.outputs.failed == 'true' && 'failed' || 'passed' }}
          TOTAL: ${{ steps.totals.outputs.total }}
          PASSED: ${{ steps.totals.outputs.passed }}
          FAILED: ${{ steps.totals.outputs.failed }}
          DURATION: ${{ steps.totals.outputs.duration }}
          REPORT_PATH: ${{ steps.upload.outcome == 'success' && format('runs/{0}/index.html', steps.opts.outputs.run_id) || '' }}
          # What was actually run, so a result can be traced back to a tree.
          #
          # The version alone is not enough: it moves on release, and most runs
          # happen between releases, so every run in a fortnight would claim the
          # same one. The sha is the precise answer and the version is the
          # readable one — they answer "which commit?" and "which release?",
          # which are different questions.
          SUITE_SHA: ${{ github.sha }}
        run: |
          SUITE_VERSION=$(node -p "require('./package.json').version")
          export SUITE_VERSION

          BODY=$(node -e '
            const { existsSync, readFileSync } = require("fs")
            const failureDetail = () => {
              if (!existsSync("failures.json")) return {}
              try {
                const { failures, omitted } = JSON.parse(readFileSync("failures.json", "utf8"))
                return failures?.length ? { failures, failuresOmitted: omitted ?? 0 } : {}
              } catch {
                return {}
              }
            }
            process.stdout.write(JSON.stringify({
              runId: process.env.RUN_ID,
              status: process.env.STATUS,
              total: Number(process.env.TOTAL || 0),
              passed: Number(process.env.PASSED || 0),
              failed: Number(process.env.FAILED || 0),
              ...(process.env.DURATION ? { durationMs: Number(process.env.DURATION) } : {}),
              // Which tests failed, when the step above produced a summary. Sent
              // only when there is something to say: an older dashboard ignores
              // the field, and a run with no failures has no list to carry.
              ...failureDetail(),
              suiteVersion: process.env.SUITE_VERSION || undefined,
              suiteSha: process.env.SUITE_SHA || undefined,
              // Omitted when the upload did not succeed: the dashboard
              // COALESCEs this, so leaving it out keeps whatever was there
              // rather than claiming a report that is not.
              ...(process.env.REPORT_PATH ? { reportPath: process.env.REPORT_PATH } : {}),
              workflowUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            }))
          ')

          TS=$(date +%s)
          SIG=$(printf '%s.%s' "$TS" "$BODY" \
            | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" \
            | awk '{print $2}')

          curl -sS --fail-with-body -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Webhook-Timestamp: $TS" \
            -H "X-Webhook-Signature: $SIG" \
            -d "$BODY"

      # The job's own verdict, restored after the callback has been sent.
      - name: Fail if the suite failed
        if: steps.run.outputs.failed == 'true'
        run: exit 1

      # Uploaded on success too: an on-demand run is usually an investigation,
      # and the trace is the reason you asked for it.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: on-demand-report
          path: packages/*/playwright-report/
          retention-days: 14
